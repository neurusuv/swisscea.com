name: Import WeChat article to SCEA news

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-wechat-news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi beautifulsoup4 markdownify
      - name: Import verified article and images
        run: python scripts/import_wechat_scea.py
      - name: Commit verified article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news docs/public/images/news
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified WeChat article on SCEA"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
