name: Import WeChat article to SCEA news

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-wechat-news.yml'
      - 'scripts/import_wechat_scea.py'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi beautifulsoup4 markdownify
      - name: Import verified article and images
        run: |
          for id in 5J8p-6znb61jHxLBmz7b0A fm7CHl6ORw3wNYMNcZ_Ayg QypoIM36DBQCuWmTiXqpTg e3npbqgs5BCMOkZZIjmigg LvKormowe477w7NEHUFACg dQmi3ODmsWdl-pr3pkIBCQ HNo6C50TWYF6C88pUSP3og 4QMdMDQLc7lZGTUylRaXKA AOiRlCwijlBB_r7Ukzbdtg 2U3dN5kiRFOhBL0A8Snahg tsbt9deBmvPD0tppWWLX3Q 63GFfdmbAQV1PhKYatLJQw 6n5-j1Smjq-Be8AqxoEL0w rL1C936RVRPGpfvhv4kW_Q 02B51UhV4m_A3US2oaZXqA npKX_K9bnpmRmzFgl6lErw Tu0-vexI_g_ojuuBRgABxQ VG-C_Z2I9yoYS4JPtXKBQQ; do
            echo "::group::Import $id"
            python scripts/import_wechat_scea.py "$id" || echo "::warning::Failed to import $id"
            echo "::endgroup::"
          done
      - name: Commit verified article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news docs/public/images/news
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified WeChat article on SCEA"
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
