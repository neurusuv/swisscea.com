name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/generate_news_lists.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: swisscea-pages-build
      cancel-in-progress: true
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: swisscea-pages-deploy
      cancel-in-progress: false
    name: Deploy
    steps:
      - name: Skip superseded build
        id: current
        uses: actions/github-script@v7
        env:
          BUILT_REVISION: ${{ needs.build.outputs.revision }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main'
            });
            let current = data.object.sha === process.env.BUILT_REVISION;
            if (!current) {
              const { data: diff } = await github.rest.repos.compareCommits({
                ...context.repo,
                base: process.env.BUILT_REVISION,
                head: data.object.sha
              });
              const siteFile = path => path.startsWith('docs/') || [
                'package.json', 'package-lock.json',
                'scripts/generate_news_lists.mjs', '.github/workflows/deploy.yml'
              ].includes(path);
              // A README-only push has no replacement build, so it must not
              // suppress this deployment. Fail closed if the diff is truncated.
              current = diff.status === 'ahead' && diff.files.length < 300 &&
                !diff.files.some(file => siteFile(file.filename) ||
                  (file.previous_filename && siteFile(file.previous_filename)));
            }
            core.setOutput('publish', String(current));
            if (!current) core.notice('A newer main revision will publish instead.');

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
